# Copy to k8s/secrets.yaml (git-ignored), fill in real values, then:
#   kubectl apply -f k8s/secrets.yaml
#
# Get the key pair from https://dashboard.razorpay.com -> Settings -> API Keys.
# Set the webhook secret in Settings -> Webhooks (point the webhook at
# https://<your-host>/api/payments/razorpay/webhook).
apiVersion: v1
kind: Secret
metadata:
  name: razorpay-credentials
  namespace: bakery
type: Opaque
stringData:
  keyId: rzp_test_XXXXXXXXXXXXXX
  keySecret: CHANGE_ME
  webhookSecret: CHANGE_ME
---
# Only needed if CURRENCY_API_PROVIDER is set to 'exchangerate-api' for
# higher rate limits / an SLA. The default provider ('open-er-api') is
# free and keyless, so this secret can be omitted entirely.
# Get a key from https://www.exchangerate-api.com
apiVersion: v1
kind: Secret
metadata:
  name: currency-api-credentials
  namespace: bakery
type: Opaque
stringData:
  apiKey: 8076f6f1fe5236ec20b685ba
